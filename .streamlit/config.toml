[theme]
base = "light"
font = "noto-sans-jp"
codeFont = "noto-sans-jp"

# 宣言したウェイトはブラウザが必要に応じて取りに行く。
# 9ウェイト（約5.4MB）を並べていたが、実際に使うのは本文・強調・見出しの3つだけ。
# スマホで卓上から開くことを考えると、使わないウェイトの宣言は載せない。

[[theme.fontFaces]]
family = "noto-sans-jp"
url = "static/NotoSansJP-Regular.ttf"
style = "normal"
weight = 400

[[theme.fontFaces]]
family = "noto-sans-jp"
url = "static/NotoSansJP-SemiBold.ttf"
style = "normal"
weight = 600

[[theme.fontFaces]]
family = "noto-sans-jp"
url = "static/NotoSansJP-Bold.ttf"
style = "normal"
weight = 700

[server]
enableStaticServing = true
